<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-label="remember this: search the index, update the note if it exists, otherwise create it with frontmatter and link it from a MOC, then rebuild the index" font-family="Helvetica,Arial,sans-serif"><title>Capturing a memory without creating duplicates</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8D97B5"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7AA2FF"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF6B6B"/></marker></defs><rect width="1200" height="430" rx="18" fill="#0F1426"/><rect x="40" y="150" width="170" height="70" rx="12" fill="#1A2140" stroke="#4A5578" stroke-width="2"/><text x="125.0" y="181.0" font-size="16" fill="#E8ECF4" text-anchor="middle" font-weight="700">"Remember X"</text><text x="125.0" y="201.0" font-size="13" fill="#8D97B5" text-anchor="middle" font-weight="400">user says</text><line x1="210" y1="185" x2="290" y2="185" stroke="#8D97B5" stroke-width="2.2" marker-end="url(#a)"/><text x="250.0" y="176.0" font-size="13" fill="#8D97B5" text-anchor="middle" font-weight="400">search</text><rect x="290" y="150" width="200" height="70" rx="12" fill="#7AA2FF22" stroke="#7AA2FF" stroke-width="2"/><text x="390.0" y="181.0" font-size="16" fill="#E8ECF4" text-anchor="middle" font-weight="700">Index + MOCs</text><text x="390.0" y="201.0" font-size="13" fill="#8D97B5" text-anchor="middle" font-weight="400">does it exist?</text><line x1="490" y1="170" x2="590" y2="95" stroke="#3DDC97" stroke-width="2.2" marker-end="url(#g)"/><text x="530" y="116" font-size="13" fill="#3DDC97" text-anchor="middle" font-weight="400">yes</text><line x1="490" y1="200" x2="590" y2="275" stroke="#8D97B5" stroke-width="2.2" marker-end="url(#a)"/><text x="470" y="262" font-size="13" fill="#8D97B5" text-anchor="middle" font-weight="400">no, or similar title?</text><rect x="590" y="60" width="250" height="70" rx="12" fill="#3DDC9722" stroke="#3DDC97" stroke-width="2"/><text x="715.0" y="91.0" font-size="16" fill="#E8ECF4" text-anchor="middle" font-weight="700">Update existing note</text><text x="715.0" y="111.0" font-size="13" fill="#8D97B5" text-anchor="middle" font-weight="400">append dated line, fix stale</text><rect x="590" y="240" width="250" height="70" rx="12" fill="#7AA2FF22" stroke="#7AA2FF" stroke-width="2"/><text x="715.0" y="271.0" font-size="16" fill="#E8ECF4" text-anchor="middle" font-weight="700">new_note.py</text><text x="715.0" y="291.0" font-size="13" fill="#8D97B5" text-anchor="middle" font-weight="400">duplicate guard + frontmatter</text><line x1="840" y1="275" x2="930" y2="275" stroke="#8D97B5" stroke-width="2.2" marker-end="url(#a)"/><text x="885.0" y="266.0" font-size="13" fill="#8D97B5" text-anchor="middle" font-weight="400">links from</text><rect x="930" y="240" width="230" height="70" rx="12" fill="#7AA2FF22" stroke="#7AA2FF" stroke-width="2"/><text x="1045.0" y="271.0" font-size="16" fill="#E8ECF4" text-anchor="middle" font-weight="700">MOC</text><text x="1045.0" y="291.0" font-size="13" fill="#8D97B5" text-anchor="middle" font-weight="400">hub gains a line</text><line x1="1045" y1="240" x2="1045" y2="172" stroke="#8D97B5" stroke-width="2.2" marker-end="url(#a)"/><text x="1075" y="210" font-size="13" fill="#8D97B5" text-anchor="middle" font-weight="400">then</text><line x1="840" y1="100" x2="930" y2="125" stroke="#8D97B5" stroke-width="2.2" marker-end="url(#a)"/><text x="885" y="98" font-size="13" fill="#8D97B5" text-anchor="middle" font-weight="400">then</text><rect x="930" y="100" width="230" height="70" rx="12" fill="#7AA2FF22" stroke="#7AA2FF" stroke-width="2"/><text x="1045.0" y="131.0" font-size="16" fill="#E8ECF4" text-anchor="middle" font-weight="700">build_index.py</text><text x="1045.0" y="151.0" font-size="13" fill="#8D97B5" text-anchor="middle" font-weight="400">MOCs first, size capped</text><text x="40" y="380" font-size="14" fill="#8D97B5" text-anchor="start" font-weight="400">A near-identical title blocks creation (exit 1). The agent updates the old note instead, so memory stays one fact per note.</text></svg>