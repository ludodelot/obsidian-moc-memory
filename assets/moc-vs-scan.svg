<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="Two ways an agent answers a question about the vault: scanning every note, or going from index to MOC to two linked notes" font-family="Helvetica,Arial,sans-serif"><title>MOC-first retrieval vs scanning the whole vault</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8D97B5"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7AA2FF"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF6B6B"/></marker></defs><rect width="1200" height="500" rx="18" fill="#0F1426"/><text x="40" y="48" font-size="18" fill="#8D97B5" text-anchor="start" font-weight="700">Without MOCs: scan everything</text><rect x="40" y="70" width="190" height="70" rx="12" fill="#1A2140" stroke="#4A5578" stroke-width="2"/><text x="135.0" y="101.0" font-size="16" fill="#E8ECF4" text-anchor="middle" font-weight="700">Question</text><text x="135.0" y="121.0" font-size="13" fill="#8D97B5" text-anchor="middle" font-weight="400">about camera gear</text><line x1="230" y1="105" x2="330" y2="105" stroke="#8D97B5" stroke-width="2.2" marker-end="url(#a)"/><text x="280.0" y="96.0" font-size="13" fill="#8D97B5" text-anchor="middle" font-weight="400">grep</text><rect x="330" y="70" width="230" height="70" rx="12" fill="#1A2140" stroke="#FF6B6B" stroke-width="2"/><text x="445.0" y="101.0" font-size="16" fill="#E8ECF4" text-anchor="middle" font-weight="700">Search whole vault</text><text x="445.0" y="121.0" font-size="13" fill="#8D97B5" text-anchor="middle" font-weight="400">hundreds of notes</text><line x1="560" y1="105" x2="660" y2="105" stroke="#8D97B5" stroke-width="2.2" marker-end="url(#a)"/><text x="610.0" y="96.0" font-size="13" fill="#8D97B5" text-anchor="middle" font-weight="400">20+ hits</text><rect x="660" y="70" width="230" height="70" rx="12" fill="#1A2140" stroke="#FF6B6B" stroke-width="2"/><text x="775.0" y="101.0" font-size="16" fill="#E8ECF4" text-anchor="middle" font-weight="700">Read many notes</text><text x="775.0" y="121.0" font-size="13" fill="#8D97B5" text-anchor="middle" font-weight="400">most irrelevant</text><line x1="890" y1="105" x2="980" y2="105" stroke="#8D97B5" stroke-width="2.2" marker-end="url(#a)"/><text x="935.0" y="96.0" font-size="13" fill="#8D97B5" text-anchor="middle" font-weight="400">guesses</text><rect x="980" y="70" width="180" height="70" rx="12" fill="#1A2140" stroke="#FF6B6B" stroke-width="2"/><text x="1070.0" y="101.0" font-size="16" fill="#E8ECF4" text-anchor="middle" font-weight="700">Answer</text><text x="1070.0" y="121.0" font-size="13" fill="#8D97B5" text-anchor="middle" font-weight="400">slow, no source</text><text x="40" y="215" font-size="18" fill="#7AA2FF" text-anchor="start" font-weight="700">With MOC memory: index, hub, two notes</text><rect x="40" y="260" width="170" height="80" rx="12" fill="#1A2140" stroke="#4A5578" stroke-width="2"/><text x="125.0" y="296.0" font-size="16" fill="#E8ECF4" text-anchor="middle" font-weight="700">Question</text><text x="125.0" y="316.0" font-size="13" fill="#8D97B5" text-anchor="middle" font-weight="400">about camera gear</text><line x1="210" y1="300" x2="290" y2="300" stroke="#8D97B5" stroke-width="2.2" marker-end="url(#a)"/><text x="250.0" y="291.0" font-size="13" fill="#8D97B5" text-anchor="middle" font-weight="400">reads</text><rect x="290" y="260" width="190" height="80" rx="12" fill="#7AA2FF22" stroke="#7AA2FF" stroke-width="2"/><text x="385.0" y="296.0" font-size="16" fill="#E8ECF4" text-anchor="middle" font-weight="700">_INDEX.md</text><text x="385.0" y="316.0" font-size="13" fill="#8D97B5" text-anchor="middle" font-weight="400">1 line per note</text><line x1="480" y1="300" x2="560" y2="300" stroke="#8D97B5" stroke-width="2.2" marker-end="url(#a)"/><text x="520.0" y="291.0" font-size="13" fill="#8D97B5" text-anchor="middle" font-weight="400">picks hub</text><rect x="560" y="260" width="190" height="80" rx="12" fill="#7AA2FF22" stroke="#7AA2FF" stroke-width="2"/><text x="655.0" y="296.0" font-size="16" fill="#E8ECF4" text-anchor="middle" font-weight="700">MOC-Photography</text><text x="655.0" y="316.0" font-size="13" fill="#8D97B5" text-anchor="middle" font-weight="400">links 2 notes</text><line x1="750" y1="285" x2="830" y2="254" stroke="#8D97B5" stroke-width="2.2" marker-end="url(#a)"/><text x="785" y="252" font-size="13" fill="#8D97B5" text-anchor="middle" font-weight="400">[[link]]</text><line x1="750" y1="315" x2="830" y2="346" stroke="#8D97B5" stroke-width="2.2" marker-end="url(#a)"/><text x="785" y="354" font-size="13" fill="#8D97B5" text-anchor="middle" font-weight="400">[[link]]</text><rect x="830" y="226" width="190" height="56" rx="12" fill="#7AA2FF22" stroke="#7AA2FF" stroke-width="2"/><text x="925.0" y="259.0" font-size="16" fill="#E8ECF4" text-anchor="middle" font-weight="700">Camera Gear</text><rect x="830" y="318" width="190" height="56" rx="12" fill="#7AA2FF22" stroke="#7AA2FF" stroke-width="2"/><text x="925.0" y="351.0" font-size="16" fill="#E8ECF4" text-anchor="middle" font-weight="700">Project Portfolio</text><line x1="1020" y1="254" x2="1070" y2="278" stroke="#7AA2FF" stroke-width="2.2" marker-end="url(#a)"/><line x1="1020" y1="346" x2="1070" y2="322" stroke="#7AA2FF" stroke-width="2.2" marker-end="url(#a)"/><rect x="1070" y="246" width="100" height="108" rx="12" fill="#3DDC9722" stroke="#3DDC97" stroke-width="2"/><text x="1120.0" y="305.0" font-size="16" fill="#E8ECF4" text-anchor="middle" font-weight="700">Answer</text><text x="1120" y="382" font-size="13" fill="#3DDC97" text-anchor="middle" font-weight="400">cites path</text><text x="40" y="452" font-size="14" fill="#8D97B5" text-anchor="start" font-weight="400">The MOC scopes the search before any note is read: two notes opened instead of the whole vault, and the answer carries its source.</text></svg>